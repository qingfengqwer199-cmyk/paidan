<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公文排版系统</title>

<style>
body {
    background:#ccc;
    display:flex;
    justify-content:center;
    padding:20px;
    font-family: "SimSun";
}

/* A4 */
.page {
    width:210mm;
    height:297mm;
    background:white;
    padding:30mm 25mm;
    position:relative;
}

/* 标题 */
.title {
    font-size:42px;
    font-family:"SimHei";
    font-weight:bold;
    text-align:center;
    margin-bottom:30px;
}

/* 正文 */
.content {
    font-size:16px;
    line-height:2;
}

/* 日期（可拖动） */
.date {
    position:absolute;
    left:400px;
    top:700px;
    font-size:16px;
    cursor:move;
}

/* 印章（完全独立） */
.stamp {
    width:160px;
    position:absolute;
    cursor:move;
    z-index:10;
}

/* 初始位置（只是默认，不会再自动改变） */
#stamp1 {
    left:300px;
    top:750px;
}

#stamp2 {
    left:500px;
    top:750px;
}

</style>
</head>

<body>

<div class="page">

    <!-- 标题 -->
    <div class="title">援助金申请</div>

    <!-- 正文 -->
    <div class="content" contenteditable="true">
        尊敬的商家：张成虎<br>
        身份证号码：370283198602082034<br>
        商家账号：zhangchenghu@163.com<br><br>

        由于商家资金临时周转困难，无法全额支付店铺订单提货款，经双方商议达成一致由三方合作顾问：（运营总监）为商家担保申请援助金：44942元，协助商家处理店铺订单事宜。

        当闭店结算办理完成之后，商家需要在72小时内归还援助金，超时将由商家支付援助金的3%滞纳金。<br><br>

        此业务办理成功后，援助金将在10分钟内下达到商家实名店铺充值钱包账户里，商家需要及时完成闭店结算办理，归还商家垫资金额！
    </div>

    <!-- 日期 -->
    <div id="date" class="date" contenteditable="true">
        2026年04月10日
    </div>

    <!-- 印章 -->
    <img id="stamp1" class="stamp" src="OM-yinzhang.png">
    <img id="stamp2" class="stamp" src="tik tokyinzhang.png">

</div>

<script>

/* ===== 通用拖动（完全独立）===== */
function enableDrag(el){

    let isDragging = false;
    let startX, startY, startLeft, startTop;

    el.addEventListener("mousedown", function(e){
        isDragging = true;

        startX = e.clientX;
        startY = e.clientY;

        startLeft = el.offsetLeft;
        startTop = el.offsetTop;

        document.body.style.userSelect = "none";
    });

    document.addEventListener("mousemove", function(e){
        if(!isDragging) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        el.style.left = (startLeft + dx) + "px";
        el.style.top = (startTop + dy) + "px";
    });

    document.addEventListener("mouseup", function(){
        isDragging = false;
        document.body.style.userSelect = "";
    });
}

/* 启用拖动 */
enableDrag(document.getElementById("stamp1"));
enableDrag(document.getElementById("stamp2"));
enableDrag(document.getElementById("date"));

</script>

</body>
</html>
