<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>A4编辑页面</title>

<style>
body {
    background:#ccc;
    display:flex;
    justify-content:center;
    padding:20px;
}

/* A4纸 */
.page {
    width:210mm;
    height:297mm;
    background:white;
    padding:20mm;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    position:relative;
}

/* 可编辑区域 */
.editable {
    border:none;
    padding:30px;
    min-height:60px;
    cursor:text;
}

/* 印章 */
.stamp {
    width:150px;
    position:absolute;
    top:180px;
    left:180px;
    cursor:move;
}
    
</style>
</head>

<body>

<div class="page" id="page">

    <h2 contenteditable="true" class="editable">点击可编辑内容 </h2>

    <p contenteditable="true" class="editable">
       尊敬的商家：</p>
       身份证号码：</p>
       商家账号:</p>
       由于商家资金临时周转困难,无法全额支付店铺订单提货款，经双方商议达成一致由三方合作顾问：（运营总监）为商家担保申请援助金：151000美元,协助商家处理店铺订单事宜。当闭店结算办理完成之后，商家需要在72小时内归还援助金，超时将由商家支付救援金的3%滞纳金。
此业务办理成功后，救援金将在10分钟内下达到商家实名店铺充值钱包账户里，商家需要及时完成闭店结算办理。归还商家垫资金额！</p>
 
    </p>

    <!-- 印章 -->
    <img id="stamp" class="stamp" src="OM-yinzhang.png" alt="印章"> 

</div>
    
<!-- 控制区 -->
<div style="position:fixed;right:20px;top:20px;background:white;padding:10px;">
    
    <input type="file" id="upload" accept="image/*"><br><br>

    <button onclick="printPage()">🖨 打印</button>

</div>

<script>

// 上传印章
document.getElementById("upload").onchange = function(e){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("stamp").src = reader.result;
    }
    reader.readAsDataURL(file);
}

// 拖动印章
let stamp = document.getElementById("stamp");
let isDragging = false;

stamp.onmousedown = function(e){
    isDragging = true;
}

document.onmouseup = function(){
    isDragging = false;
}

document.onmousemove = function(e){
    if(isDragging){
        stamp.style.left = e.pageX - 60 + "px";
        stamp.style.top = e.pageY - 60 + "px";
    }

// 打印
function printPage(){
    window.print();
}

</script>

</body>
</html>
